# CI ワークフロー
#
# Node.js / npm プロジェクト向けの標準 CI パイプラインです。
# 言語やパッケージマネージャーが異なる場合は、各ステップを差し替えてください:
#   - Python: actions/setup-python + pip/poetry/uv
#   - Go: actions/setup-go
#   - pnpm/yarn の場合は cache: 'npm' を 'pnpm'/'yarn' に変更
#
# package.json が存在しない（言語未確定の）リポジトリでは detect ジョブの判定により
# 後続ジョブをスキップします（`hashFiles` はジョブレベルの `if` では使えないため）。
#
# lint / type-check は `--if-present` で実行し、package.json にスクリプトがなければ何もせず成功します。
# （Vite の雛形には `type-check` がなく、`build` の `tsc -b` が型チェックを兼ねるため）

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect project
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has-package-json: ${{ steps.check.outputs.has-package-json }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: package.json の有無を判定
        id: check
        run: |
          if [ -f package.json ]; then
            echo "has-package-json=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-package-json=false" >> "$GITHUB_OUTPUT"
            echo "package.json が存在しないため、CI をスキップします"
          fi

  lint:
    name: Lint
    needs: detect
    if: needs.detect.outputs.has-package-json == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Node.js のセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: 依存関係のインストール
        run: npm ci
      - name: Lint
        run: npm run lint --if-present

  typecheck:
    name: Type check
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Node.js のセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: 依存関係のインストール
        run: npm ci
      - name: 型チェック
        run: npm run type-check --if-present

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Node.js のセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: 依存関係のインストール
        run: npm ci
      # TODO: テストスクリプトが存在する場合は有効化してください
      # - run: npm run test:unit
      - name: test プレースホルダー
        run: echo "TODO - test コマンドを設定してください"

  build:
    name: Build
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Node.js のセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: 依存関係のインストール
        run: npm ci
      - name: ビルド
        run: npm run build
        env:
          NODE_ENV: production
